name: Sign IPA

# 给 iPhone 安装包（.ipa）签名的流水线。
# 两种模式：
#   adhoc：临时签名，不用任何 Apple ID，只验证“解包—签名—打包—上传”这条路通不通。
#          签出来的包装不到真机上（苹果不认临时签名）。
#   real：真签名，需要 Secrets 里的开发者证书 + 描述文件，签出来的包能装到手机上，7 天过期。
# 详细说明见 README.md。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'adhoc = 临时签名（不用 Apple ID）；real = 真签名（需要 Secrets）'
        type: choice
        options: [adhoc, real]
        default: adhoc
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    env:
      IPA_URL: https://github.com/OpenListApp/OpenListApp/releases/download/v2025.07.292/ios-release.zip
      BUNDLE_ID: com.github.openlist.openlist
      IPA_WORK: ${{ runner.temp }}/ipa-work
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备未签名的 IPA
        run: bash scripts/prepare-ipa.sh

      - name: 临时签名（adhoc）
        if: github.event_name == 'push' || github.event.inputs.mode == 'adhoc'
        run: bash scripts/sign-adhoc.sh

      - name: 真签名（需要 Secrets）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'real'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: bash scripts/sign-real.sh

      - name: 验签
        run: bash scripts/verify-ipa.sh

      - name: 上传签好的 IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa-${{ github.run_number }}
          path: out/signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: 把验证结果写回仓库
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ github.event_name == 'push' && 'adhoc' || github.event.inputs.mode }}
        run: bash scripts/write-report.sh
